name: Post-CI Secret Check

# Request 3: run AFTER the CI workflow has completed, and keep secret access
# even when the triggering PR came from a fork.
#
# Why this works:
#   * `workflow_run` fires once the referenced workflow(s) finish ("ready").
#   * A `workflow_run` workflow always executes from the DEFAULT branch of
#     THIS repo, in the base-repo context, so repository secrets ARE available
#     regardless of whether the upstream run was for a fork PR.
#   * This is the standard, safe pattern for giving fork PRs the results of a
#     privileged step without ever exposing secrets to untrusted PR code.
on:
  workflow_run:
    workflows:
      - CI            # must match the `name:` of ci.yml
    types:
      - completed

permissions:
  contents: read

jobs:
  secret-check:
    name: Secret check (workflow_run)
    runs-on: ubuntu-latest
    env:
      MY_SECRET: ${{ secrets.MY_SECRET }}
    steps:
      - name: Report upstream run context
        run: |
          echo "Upstream workflow: ${{ github.event.workflow_run.name }}"
          echo "Upstream event:    ${{ github.event.workflow_run.event }}"
          echo "Upstream status:   ${{ github.event.workflow_run.status }}"
          echo "Upstream result:   ${{ github.event.workflow_run.conclusion }}"
          echo "Head branch:       ${{ github.event.workflow_run.head_branch }}"
          echo "Head repo:         ${{ github.event.workflow_run.head_repository.full_name }}"
          echo "Base repo:         ${{ github.repository }}"
          if [ "${{ github.event.workflow_run.head_repository.full_name }}" != "${{ github.repository }}" ]; then
            echo "The upstream run was for a FORK PR."
          else
            echo "The upstream run was for a same-repo PR."
          fi

      - name: Report secret availability
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "MY_SECRET IS available here (length=${#MY_SECRET}) even for fork PRs."
            if [ "$MY_SECRET" = "yes" ]; then
              echo "MY_SECRET matches the expected value."
            else
              echo "MY_SECRET is set but does NOT match the expected value."
            fi
          else
            echo "MY_SECRET is EMPTY (unexpected for workflow_run)."
          fi
