name: CI

# Runs on every pull request, including PRs opened from forks.
#
# Fork behavior notes:
#   * For a PR from a FORK, the GITHUB_TOKEN is read-only and repository
#     secrets are NOT exposed to the workflow (secrets.* evaluate to "").
#   * For a PR from a branch in THIS repo, the token is read/write and
#     secrets ARE available.
#
# Auto-merge is intentionally NOT handled here. Both fork and maintainer PRs
# are merged by the single "Fork Auto Merge" (workflow_run) flow, which has a
# write token even for fork PRs. This removes the old same-repo-only auto-merge
# job so there is exactly one merge path.
on:
  pull_request:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Validate secret access on `pull_request`.
  # For fork PRs, MY_SECRET is empty. For same-repo PRs, it equals "yes".
  # -------------------------------------------------------------------------
  secret-check:
    name: Secret check (pull_request)
    runs-on: ubuntu-latest
    env:
      MY_SECRET: ${{ secrets.MY_SECRET }}
    steps:
      - name: Report secret availability
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Head repo: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "Base repo: ${{ github.repository }}"
          if [ -n "$MY_SECRET" ]; then
            echo "MY_SECRET IS available (length=${#MY_SECRET})."
            if [ "$MY_SECRET" = "yes" ]; then
              echo "MY_SECRET matches the expected value."
            else
              echo "MY_SECRET is set but does NOT match the expected value."
            fi
          else
            echo "MY_SECRET is EMPTY -> this is a fork PR (secrets are not exposed)."
          fi

  # -------------------------------------------------------------------------
  # A normal build job that always runs (fork or not).
  # -------------------------------------------------------------------------
  build:
    name: Build (always runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "Build runs for every PR, including forks."
